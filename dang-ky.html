<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng ký – RentSmart</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">
</head>
<body data-base="">
<main class="auth-page">
  <div class="auth-card wide">
    <a class="brand" href="index.html"><span class="brand-icon"><i class="bi bi-house-heart-fill"></i></span><span>Rent<span>Smart</span></span></a>
    <h1>Tạo tài khoản</h1>
    <div class="alert alert-danger d-none" id="formError" role="alert"></div>
    <form id="registerForm" novalidate>
      <fieldset class="mb-3"><legend class="form-label fs-6">Bạn là ai?</legend>
        <div class="row g-2">
          <div class="col-6"><label class="role-card"><input type="radio" name="role" value="tenant"><span class="role-body"><i class="bi bi-check-circle-fill tick"></i><i class="bi bi-search big"></i><strong>Người thuê</strong><span>Tìm và lưu phòng phù hợp</span></span></label></div>
          <div class="col-6"><label class="role-card"><input type="radio" name="role" value="landlord"><span class="role-body"><i class="bi bi-check-circle-fill tick"></i><i class="bi bi-building big"></i><strong>Chủ nhà</strong><span>Đăng tin cho thuê phòng</span></span></label></div>
        </div><div class="invalid-feedback" id="roleErr">Vui lòng chọn vai trò.</div></fieldset>
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label" for="fullName">Họ và tên</label><input class="form-control" id="fullName" autocomplete="name" required><div class="invalid-feedback"></div></div>
        <div class="col-md-6"><label class="form-label" for="username">Tên đăng nhập</label><input class="form-control" id="username" autocomplete="username" required><div class="invalid-feedback"></div></div>
        <div class="col-md-6"><label class="form-label" for="email">Email</label><input type="email" class="form-control" id="email" autocomplete="email" required><div class="invalid-feedback"></div></div>
        <div class="col-md-6"><label class="form-label" for="phone">Số điện thoại</label><input type="tel" class="form-control" id="phone" autocomplete="tel" placeholder="0901234567" required><div class="invalid-feedback"></div></div>
        <div class="col-md-6"><label class="form-label" for="password">Mật khẩu</label>
          <div class="pw-wrap"><input type="password" class="form-control" id="password" autocomplete="new-password" required><button type="button" class="pw-toggle" aria-label="Hiện/ẩn mật khẩu"><i class="bi bi-eye"></i></button></div>
          <div class="strength" aria-hidden="true"><span id="strengthBar"></span></div><small class="text-muted" id="strengthText">Tối thiểu 8 ký tự</small><div class="invalid-feedback"></div></div>
        <div class="col-md-6"><label class="form-label" for="confirm">Nhập lại mật khẩu</label>
          <div class="pw-wrap"><input type="password" class="form-control" id="confirm" autocomplete="new-password" required><button type="button" class="pw-toggle" aria-label="Hiện/ẩn mật khẩu"><i class="bi bi-eye"></i></button></div><div class="invalid-feedback"></div></div>
      </div>
      <div class="row g-3 mt-0 d-none" id="landlordFields">
        <div class="col-md-6"><label class="form-label" for="managedRooms">Số phòng đang quản lý <span class="text-muted">(tùy chọn)</span></label><input type="number" min="0" class="form-control" id="managedRooms"></div>
        <div class="col-md-6"><label class="form-label" for="activeArea">Khu vực hoạt động <span class="text-muted">(tùy chọn)</span></label><input class="form-control" id="activeArea" placeholder="VD: Quận 7, Bình Thạnh"></div>
      </div>
      <div class="form-check my-3"><input class="form-check-input" type="checkbox" id="terms"><label class="form-check-label" for="terms">Tôi đồng ý với điều khoản sử dụng và chính sách bảo mật</label><div class="invalid-feedback">Bạn cần đồng ý với điều khoản.</div></div>
      <button class="btn btn-primary w-100" id="submitBtn"><span class="spinner-border spinner-border-sm d-none me-1"></span>Đăng ký</button>
    </form>
    <p class="text-center mt-3 mb-0">Đã có tài khoản? <a href="dang-nhap.html">Đăng nhập</a></p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/pages/auth.js"></script>
</body>
</html>
