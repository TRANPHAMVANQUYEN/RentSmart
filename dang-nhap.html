<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập – RentSmart</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">
</head>
<body data-base="">
<main class="auth-page">
  <div class="auth-card">
    <a class="brand" href="index.html"><span class="brand-icon"><i class="bi bi-house-heart-fill"></i></span><span>Rent<span>Smart</span></span></a>
    <h1>Đăng nhập</h1>
    <div class="alert alert-danger d-none" id="formError" role="alert"></div>
    <form id="loginForm" novalidate>
      <div class="mb-3"><label class="form-label" for="identifier">Email, số điện thoại hoặc tên đăng nhập</label>
        <input class="form-control" id="identifier" autocomplete="username" required>
        <div class="invalid-feedback">Vui lòng nhập tài khoản.</div></div>
      <div class="mb-3"><label class="form-label" for="password">Mật khẩu</label>
        <div class="pw-wrap"><input type="password" class="form-control" id="password" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" aria-label="Hiện/ẩn mật khẩu"><i class="bi bi-eye"></i></button></div>
        <div class="invalid-feedback d-block" id="pwErr"></div></div>
      <div class="d-flex justify-content-between mb-3">
        <div class="form-check"><input class="form-check-input" type="checkbox" id="remember"><label class="form-check-label" for="remember">Ghi nhớ đăng nhập</label></div>
        <a href="quen-mat-khau.html">Quên mật khẩu?</a></div>
      <button class="btn btn-primary w-100" id="submitBtn"><span class="spinner-border spinner-border-sm d-none me-1"></span>Đăng nhập</button>
    </form>
    <p class="text-center mt-3 mb-1">Chưa có tài khoản? <a href="dang-ky.html" id="regLink">Đăng ký ngay</a></p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/pages/auth.js"></script>
</body>
</html>
