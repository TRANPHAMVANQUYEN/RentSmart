<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hồ sơ cá nhân – RentSmart</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">
  <link href="assets/css/chatbot.css" rel="stylesheet">
</head>
<body data-base="">
<div id="app-header"></div>
<main class="page-main"><div class="container" style="max-width:860px">
  <h1 class="section-title mb-3">Hồ sơ cá nhân</h1>
  <div class="row g-4">
    <div class="col-md-6"><form class="box" id="profileForm" novalidate>
      <h2>Thông tin</h2>
      <div class="d-flex align-items-center gap-3 mb-3"><div id="avatarBox"></div>
        <div><label class="btn btn-light-border btn-sm mb-0" for="avatarFile"><i class="bi bi-camera"></i> Đổi ảnh</label>
        <input type="file" id="avatarFile" accept="image/*" class="visually-hidden"></div></div>
      <div class="mb-3"><label class="form-label" for="fullName">Họ và tên</label><input class="form-control" id="fullName" required><div class="invalid-feedback">Vui lòng nhập họ tên.</div></div>
      <div class="mb-3"><label class="form-label" for="email">Email</label><input type="email" autocomplete="email" class="form-control" id="email" required><div class="invalid-feedback">Email không hợp lệ hoặc đã được sử dụng.</div></div>
      <div class="mb-3"><label class="form-label" for="phone">Số điện thoại</label><input type="tel" inputmode="tel" autocomplete="tel" class="form-control" id="phone" required><div class="invalid-feedback">Số điện thoại gồm 10 chữ số, bắt đầu bằng 0.</div></div>
      <button class="btn btn-primary" type="submit">Lưu thay đổi</button>
    </form></div>
    <div class="col-md-6"><form class="box" id="pwForm" novalidate>
      <h2>Đổi mật khẩu</h2>
      <div class="mb-3"><label class="form-label" for="oldPw">Mật khẩu hiện tại</label><input type="password" class="form-control" id="oldPw" autocomplete="current-password"><div class="invalid-feedback"></div></div>
      <div class="mb-3"><label class="form-label" for="newPw">Mật khẩu mới</label><input type="password" class="form-control" id="newPw" autocomplete="new-password"><div class="invalid-feedback"></div></div>
      <div class="mb-3"><label class="form-label" for="newPw2">Nhập lại mật khẩu mới</label><input type="password" class="form-control" id="newPw2" autocomplete="new-password"><div class="invalid-feedback"></div></div>
      <button class="btn btn-primary" type="submit">Đổi mật khẩu</button>
    </form></div>
  </div>
</div></main>
<div id="app-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/chatbot.js"></script>
<script src="assets/js/pages/profile.js"></script>
</body>
</html>
