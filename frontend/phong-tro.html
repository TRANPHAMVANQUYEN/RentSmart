<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Danh sách phòng trọ TP.HCM – RentSmart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">
  <link href="assets/css/chatbot.css" rel="stylesheet">
</head>
<body data-base="">
<div id="app-header"></div>

<main class="page-main">
  <div class="container">
    <nav aria-label="breadcrumb"><ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="index.html">Trang chủ</a></li>
      <li class="breadcrumb-item active" aria-current="page" id="crumb">Phòng trọ</li>
    </ol></nav>

    <div class="row g-4">
      <!-- Bộ lọc: cột trái trên desktop, drawer trên mobile -->
      <div class="col-lg-3">
        <div class="offcanvas-lg offcanvas-start" tabindex="-1" id="filterPanel" aria-labelledby="filterTitle">
          <div class="offcanvas-header">
            <h2 class="offcanvas-title fs-5" id="filterTitle">Bộ lọc</h2>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#filterPanel" aria-label="Đóng"></button>
          </div>
          <div class="offcanvas-body d-block p-3 p-lg-0">
            <div class="filter-panel filter-sticky" id="filters"></div>
          </div>
        </div>
      </div>

      <!-- Kết quả -->
      <div class="col-lg-9">
        <div class="toolbar">
          <div><h1 class="fs-5 fw-bold mb-0" id="resultCount">Đang tải...</h1></div>
          <div class="d-flex gap-2 flex-wrap align-items-center">
            <button class="btn btn-light-border d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#filterPanel" aria-controls="filterPanel"><i class="bi bi-funnel"></i> Bộ lọc</button>
            <label class="visually-hidden" for="sort">Sắp xếp</label>
            <select id="sort" class="form-select w-auto">
              <option value="">Mới nhất</option><option value="gia-tang">Giá tăng dần</option>
              <option value="gia-giam">Giá giảm dần</option><option value="dien-tich">Diện tích lớn nhất</option>
            </select>
            <div class="btn-group view-toggle" role="group" aria-label="Chế độ xem">
              <button type="button" class="btn btn-light-border active" data-view="luoi" aria-label="Xem dạng lưới"><i class="bi bi-grid"></i></button>
              <button type="button" class="btn btn-light-border" data-view="ds" aria-label="Xem dạng danh sách"><i class="bi bi-list-ul"></i></button>
            </div>
          </div>
        </div>
        <div class="input-icon mb-3"><i class="bi bi-search"></i>
          <label class="visually-hidden" for="kw">Từ khóa</label>
          <input type="search" id="kw" class="form-control" placeholder="Tìm theo tên đường, tiêu đề..."></div>
        <div class="row g-3" id="results"></div>
        <nav class="mt-4 d-flex justify-content-center" aria-label="Phân trang"><ul class="pagination mb-0" id="pager"></ul></nav>
      </div>
    </div>
  </div>
</main>

<div id="app-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/chatbot.js"></script>
<script src="assets/js/listing.js"></script>
</body>
</html>
