<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chi tiết phòng – RentSmart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">
  <link href="assets/css/chatbot.css" rel="stylesheet">
</head>
<body data-base="">
<div id="app-header"></div>
<main class="page-main"><div class="container" id="detail"><div class="skeleton" style="height:420px"></div></div></main>
<div id="app-footer"></div>

<div class="modal fade" id="lightbox" tabindex="-1" aria-label="Xem ảnh lớn"><div class="modal-dialog modal-xl modal-dialog-centered"><div class="modal-content bg-transparent border-0">
  <button type="button" class="btn-close btn-close-white ms-auto mb-2" data-bs-dismiss="modal" aria-label="Đóng"></button>
  <img id="lightboxImg" class="rounded" src="" alt="Ảnh phòng phóng to"></div></div></div>

<div class="modal fade" id="msgModal" tabindex="-1" aria-labelledby="msgTitle"><div class="modal-dialog modal-dialog-centered"><form class="modal-content" id="msgForm">
  <div class="modal-header"><h2 class="modal-title fs-5" id="msgTitle">Nhắn tin cho chủ nhà</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button></div>
  <div class="modal-body"><label class="form-label" for="msgText">Nội dung tin nhắn</label>
    <textarea id="msgText" class="form-control" rows="4" required>Chào bạn, phòng này còn không? Mình muốn hẹn xem phòng.</textarea></div>
  <div class="modal-footer"><button type="button" class="btn btn-light-border" data-bs-dismiss="modal">Hủy</button><button class="btn btn-primary">Gửi tin nhắn</button></div></form></div></div>

<div class="modal fade" id="reportModal" tabindex="-1" aria-labelledby="reportTitle"><div class="modal-dialog modal-dialog-centered"><form class="modal-content" id="reportForm">
  <div class="modal-header"><h2 class="modal-title fs-5" id="reportTitle">Báo cáo tin</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button></div>
  <div class="modal-body">
    <label class="form-label" for="rpReason">Lý do</label><select id="rpReason" class="form-select mb-3"></select>
    <label class="form-label" for="rpContent">Mô tả thêm</label><textarea id="rpContent" class="form-control" rows="3" maxlength="500" required></textarea></div>
  <div class="modal-footer"><button type="button" class="btn btn-light-border" data-bs-dismiss="modal">Hủy</button><button class="btn btn-primary">Gửi báo cáo</button></div></form></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/chatbot.js"></script>
<script src="assets/js/pages/detail.js"></script>
</body>
</html>
