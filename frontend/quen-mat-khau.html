<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quên mật khẩu – RentSmart</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">
</head>
<body data-base="">
<main class="auth-page">
  <div class="auth-card">
    <a class="brand" href="index.html"><span class="brand-icon"><i class="bi bi-house-heart-fill"></i></span><span>Rent<span>Smart</span></span></a>
    <h1>Quên mật khẩu</h1>
    <div class="alert alert-success d-none" id="formOk" role="status">Nếu email tồn tại trong hệ thống, chúng tôi đã gửi hướng dẫn đặt lại mật khẩu.</div>
    <form id="forgotForm" novalidate>
      <p class="text-muted">Nhập email đã đăng ký, chúng tôi sẽ gửi liên kết đặt lại mật khẩu.</p>
      <div class="mb-3"><label class="form-label" for="email">Email</label><input type="email" class="form-control" id="email" autocomplete="email" required><div class="invalid-feedback">Email không hợp lệ.</div></div>
      <button class="btn btn-primary w-100">Gửi hướng dẫn</button>
    </form>
    <p class="text-center mt-3 mb-0"><a href="dang-nhap.html"><i class="bi bi-arrow-left"></i> Quay lại đăng nhập</a></p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/pages/auth.js"></script>
</body>
</html>
